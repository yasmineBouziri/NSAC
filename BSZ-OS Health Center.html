<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSZ-OS: Health Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&family=Orbitron:wght@500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:linear-gradient(170deg,#0d1b27,#070f18);--t:#e9eff3;--m:#9db0bf;--ln:rgba(233,239,243,.28);--ac:#9fd8cf;--ac2:#7f86c9;--ok:#8fd3b6;--warn:#e3ab90;--info:#a9b8f0;--on:#0b1a24;--gl:rgba(159,216,207,.7);
--fh:"Cormorant Garamond",serif;--fb:Manrope,sans-serif;--hw:500;--hs:1;--fi:normal;--sr:50%;--bw:1px;--ss:0 0 0 transparent;--sf:rgba(7,15,24,.72);--pr:999px;--br:22px;--auo:.38;--sto:1;--nbd:none;color-scheme:dark}
[data-theme=nebula]{--bg:#04070f;--t:#fdf1dc;--m:#d3bfa6;--ln:rgba(255,214,160,.5);--ac:#f6c27a;--ac2:#6fa8dc;--ok:#9fe0c2;--warn:#f08a5d;--info:#9cc4f0;--on:#1a1208;--gl:rgba(255,196,120,.85);--hw:600;--sf:rgba(8,14,26,.8);--ss:0 0 18px rgba(255,190,110,.25);--nbd:block;--auo:0}
[data-theme=hud]{--bg:radial-gradient(ellipse at 50% 100%,#04202a,#010608 70%);--t:#d8fbff;--m:#6fb3bf;--ln:rgba(25,230,255,.5);--ac:#19e6ff;--ac2:#ff3dac;--ok:#39ffb0;--warn:#ffb020;--info:#7aa2ff;--on:#001418;--gl:rgba(25,230,255,.9);--fh:Orbitron,sans-serif;--fb:"Space Mono",monospace;--hs:.72;--sr:4px;--ss:0 0 12px rgba(25,230,255,.3);--sf:rgba(0,20,26,.88);--pr:4px;--br:6px;--auo:.1}
[data-theme=retro]{color-scheme:light;--bg:#efdfbf;--t:#2b1d14;--m:#6b5646;--ln:#2b1d14;--ac:#e8602c;--ac2:#2f7f78;--ok:#2f7f78;--warn:#c8441a;--info:#8a5a00;--on:#fff4de;--gl:rgba(232,96,44,.5);--fh:Bungee,sans-serif;--hs:.62;--hw:400;--bw:3px;--ss:3px 3px 0 #2b1d14;--sf:#f9efd8;--sbc:#2b1d14;--br:14px;--auo:0;--sto:0}
[data-theme=paper]{color-scheme:light;--bg:#f4efe4;--t:#23211f;--m:#6d665c;--ln:rgba(35,33,31,.4);--ac:#a8483a;--ac2:#5b6b4f;--ok:#4f7a58;--warn:#b5651d;--info:#4a5f8a;--on:#fbf6ea;--gl:rgba(168,72,58,.3);--hw:600;--fi:italic;--sf:#fbf7ee;--br:12px;--auo:0;--sto:0}
[data-theme=clay]{color-scheme:light;--bg:#dfe3f1;--t:#3b3f5c;--m:#7a7f9e;--ln:rgba(59,63,92,.18);--ac:#6c74f0;--ac2:#f08fb0;--ok:#2f9e82;--warn:#d9792f;--info:#5560e0;--on:#fff;--gl:rgba(108,116,240,.4);--fh:Manrope,sans-serif;--hw:700;--hs:.72;--sr:38%;--bw:0px;--ss:7px 7px 16px #b9bfd6,-7px -7px 16px #fff;--sf:#e4e8f5;--br:30px;--auo:0;--sto:0}
[data-theme=brutal]{color-scheme:light;--bg:#ffe14d;--t:#000;--m:#333;--ln:#000;--ac:#ff4d6d;--ac2:#3a86ff;--ok:#008a58;--warn:#d85a00;--info:#2a62d8;--on:#000;--gl:rgba(255,77,109,.5);--fh:"Space Mono",monospace;--fb:"Space Mono",monospace;--hw:700;--hs:.68;--sr:0;--bw:3px;--ss:4px 4px 0 #000;--sf:#fff;--pr:0;--br:0;--sbc:#000;--auo:0;--sto:0}
[data-theme=glass]{--bg:radial-gradient(at 15% 10%,#7b5cff,transparent 52%),radial-gradient(at 88% 18%,#ff7ab8,transparent 46%),radial-gradient(at 60% 105%,#2dd4e6,transparent 52%),#1b1340;--t:#fff;--m:rgba(255,255,255,.78);--ln:rgba(255,255,255,.45);--ac:#fff0fb;--ac2:#c9b8ff;--ok:#a8ffe0;--warn:#ffd0a8;--info:#c9d6ff;--on:#2a1a5e;--gl:rgba(255,255,255,.85);--hw:600;--hs:.8;--fh:Manrope,sans-serif;--sf:rgba(255,255,255,.16);--dbl:blur(22px);--auo:0;--sto:.5}
[data-theme=access]{--bg:#000a14;--t:#fff;--m:#e0ecf7;--ln:#fff;--ac:#F0E442;--ac2:#56B4E9;--ok:#56B4E9;--warn:#E69F00;--info:#F0E442;--on:#000;--gl:rgba(240,228,66,.55);--fh:Manrope,sans-serif;--hw:700;--hs:.78;--bw:3px;--sf:#000;--auo:0;--sto:.4}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);color:var(--t);background:var(--bg) fixed;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
.au{position:fixed;border-radius:50%;filter:blur(100px);opacity:var(--auo);animation:dr 30s ease-in-out infinite alternate;pointer-events:none}
.au.a{width:55vw;height:40vh;left:-10vw;top:-8vh;background:var(--ac)}.au.b{width:50vw;height:45vh;right:-12vw;top:5vh;background:var(--ac2);animation-duration:38s}.au.c{width:40vw;height:30vh;left:30vw;top:-12vh;background:var(--warn);animation-duration:44s}
@keyframes dr{to{transform:translate(8vw,6vh) scale(1.15)}}
.neb{position:fixed;inset:-6%;display:var(--nbd);pointer-events:none;filter:url(#nf);background:radial-gradient(34% 30% at 50% 36%,rgba(236,246,255,.8),rgba(150,190,230,.4) 50%,transparent 78%),radial-gradient(60% 40% at 50% -5%,rgba(255,190,100,.85),transparent 70%),radial-gradient(52% 46% at 50% 38%,rgba(255,150,70,.4),transparent 75%),radial-gradient(85% 70% at 50% 42%,rgba(60,100,170,.5),transparent 82%)}
#sky{position:fixed;inset:0;opacity:var(--sto);pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
/* header */
.top{position:fixed;inset:0 0 auto 0;display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 12px) 28px 12px;z-index:20;background:var(--sf);backdrop-filter:blur(14px);border-bottom:var(--bw) solid var(--ln)}
.logo b{font-family:var(--fh);font-size:calc(30px*(1 + var(--hs))/2);font-weight:var(--hw);font-style:var(--fi);display:block;line-height:1.1}
.logo small{display:block;color:var(--m);font-size:13px}
.nav{flex:1;display:flex;justify-content:center;gap:8px}
.tbtn{border:var(--bw) solid var(--ln);border-radius:var(--pr);padding:9px 18px;font-size:14px;font-weight:700;color:var(--t);background:var(--sf);box-shadow:var(--ss)}
.tbtn:hover{border-color:var(--ac)}
.tr{display:flex;gap:8px;margin-left:auto}.nav+.tr{margin-left:0}
.themes{position:absolute;right:28px;top:calc(100% + 8px);display:none;flex-direction:column;gap:4px;background:var(--sf);color:var(--t);border:1px solid var(--ln);border-radius:16px;padding:10px;backdrop-filter:blur(14px)}
.themes.open{display:flex}
.themes button{display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:12px;padding:8px 12px;font-size:14px}
.themes button[aria-pressed=true]{border-color:var(--ac)}
.sw{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--ln)}
.pill{border:max(1px,var(--bw)) solid var(--ln);border-radius:var(--pr);padding:.45em 1.2em;font-weight:700;color:var(--t);background:var(--sf);box-shadow:var(--ss);transition:transform .2s,border-color .2s}
.pill:hover,.pill:focus-visible,.pill[aria-pressed=true]{border-color:var(--ac)}
.pill:hover{transform:translateY(-2px)}
.pill[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 30%,var(--sf))}
.pill.sm{padding:.3em .9em;font-size:13px}
.solid{background:var(--ac);color:var(--on);font-weight:700;border:var(--bw) solid var(--sbc,var(--ac));border-radius:var(--pr);padding:.5em 1.6em;box-shadow:var(--ss)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:104px 28px 140px;position:relative}
.sec{margin-top:48px;scroll-margin-top:92px}.sec:first-child{margin-top:0}
.eb{color:var(--ac);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.sec h2{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(46px*var(--hs));line-height:1.1;margin:4px 0 8px;text-shadow:0 0 .45em var(--gl),0 0 1.4em var(--gl)}
.sub{color:var(--m);line-height:1.45;max-width:46em;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.s5{grid-column:span 5}.s7{grid-column:span 7}.s12{grid-column:span 12}
.blk{background:var(--sf);border:var(--bw) solid var(--ln);border-radius:var(--br);box-shadow:var(--ss);backdrop-filter:var(--dbl,none);padding:22px}
.blk h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:14px}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-info{color:var(--info)}.mu{color:var(--m)}
/* dashboard */
.big{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(64px*var(--hs));line-height:1;text-shadow:0 0 .45em var(--gl),0 0 1.4em var(--gl);animation:gl 5s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 .6em var(--gl),0 0 1.8em var(--gl),0 0 3.2em var(--gl)}}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.chip{border:max(1px,var(--bw)) solid var(--ln);border-radius:var(--pr);padding:.25em .8em;font-size:13px;font-weight:700}
.note{color:var(--m);font-size:13px;line-height:1.45}
.dm{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);width:100%}
.dm:last-child{border-bottom:0;padding-bottom:0}
.dm:first-of-type{padding-top:0}
.ob{width:42px;height:42px;border-radius:var(--sr);border:var(--bw) solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--ac);flex:none}
.ob svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dm b{display:block}.dm span.mu{font-size:13px;line-height:1.4}
.dm em{font-style:normal;font-weight:700;font-size:14px;text-align:right}.dm em small{display:block;color:var(--m);font-weight:400;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:block;border:1px solid var(--ln);border-radius:calc(var(--br)*.6);padding:12px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--ac);transform:translateY(-2px)}
.tile .lb{display:block;color:var(--m);font-size:12px}
.tile b{display:block;font-size:24px;margin:2px 0}.tile b small{font-size:12px;color:var(--m);font-weight:400;margin-left:3px}
.tile .dl{display:block;font-size:12px;font-weight:700}
.tile.lq{border-style:dashed}
.rb{display:block;position:relative;height:4px;border-radius:4px;background:var(--ln);margin-top:12px}
.rb .z{position:absolute;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--ok) 60%,transparent)}
.rb .p{position:absolute;top:-3px;width:3px;height:10px;border-radius:2px;background:var(--t)}
.dv{display:grid;grid-template-columns:7.5em 1fr 6.5em;align-items:center;gap:12px;padding:9px 0;font-size:14px}
.dv .tr2{position:relative;height:6px;border-radius:6px;background:var(--ln)}
.dv .tr2::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--t);opacity:.6}
.dv .tr2 i{position:absolute;top:0;bottom:0;border-radius:6px}
.dv em{font-style:normal;text-align:right;font-weight:700}
.ais{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ai{display:block;border:1px solid var(--ln);border-radius:calc(var(--br)*.7);padding:14px;transition:border-color .2s,transform .2s}
.ai:hover{border-color:var(--ac);transform:translateY(-3px)}
.ai h4{margin:0 0 4px;font-size:14px}.ai b{display:block;font-size:17px;margin-bottom:6px}.ai span{font-size:12px;line-height:1.4;color:var(--m);display:block}
/* notices */
.nl{display:flex;flex-direction:column;gap:12px}
.nt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:12px 22px 12px 14px;border:var(--bw) solid var(--ln);border-radius:var(--pr);background:var(--sf);box-shadow:var(--ss);backdrop-filter:var(--dbl,none);transition:opacity .3s}
.nt.urgent{border-color:var(--warn);box-shadow:var(--ss),0 0 26px color-mix(in srgb,var(--warn) 45%,transparent)}
.nt.done{opacity:.65}
.nt .ico{width:44px;height:44px;border-radius:var(--sr);display:grid;place-items:center;border:var(--bw) solid currentColor;font-size:17px;font-weight:700;flex:none}
.nt .pr{font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.nt .hd{display:block;font-weight:700;margin:1px 0;line-height:1.3}
.nt .mt{font-size:13px;color:var(--m)}
.nt .ac2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nt .rs{font-size:13px;color:var(--m)}
/* apps */
.apps{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.app{display:flex;flex-direction:column;gap:12px;grid-column:span 2;transition:transform .2s,border-color .2s}
.app:nth-child(n+4){grid-column:span 3}
.app:hover{transform:translateY(-4px);border-color:var(--ac)}
.app .ob{width:56px;height:56px;animation:fz var(--du,6s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes fz{to{transform:translate(var(--dx,0),var(--dy,0))}}
.app h3{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(34px*(1 + var(--hs))/2);text-transform:none;letter-spacing:0;color:var(--t);margin:0}
.app p{color:var(--m);font-size:14px;line-height:1.45}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{border:1px solid var(--ln);border-radius:var(--pr);padding:.15em .7em;font-size:12px;color:var(--m)}
.ch.off{opacity:.45;text-decoration:line-through}
.app .ft{margin-top:auto;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--m);padding-top:12px;border-top:1px solid var(--ln)}
.app .ft b{color:var(--ac)}
.foot{margin-top:40px;color:var(--m);font-size:13px;line-height:1.5;max-width:52em}
/* Zibo */
.alien{position:fixed;right:1.8vw;bottom:2.5vh;z-index:30;width:84px;touch-action:none;cursor:grab;user-select:none}
.alien.drag{cursor:grabbing}
.zi{animation:fl 5s ease-in-out infinite}.alien.drag .zi{animation:none;transform:scale(1.08)}
.alien svg{width:100%;display:block;filter:drop-shadow(0 0 16px var(--gl));transition:transform .3s}
.alien:hover svg{transform:rotate(-6deg) scale(1.06)}
@keyframes fl{50%{transform:translateY(-12px)}}
.eyes{transform-origin:50px 58px;animation:bk 6s infinite}
@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bub{position:absolute;right:85%;bottom:70%;width:15em;background:var(--sf);backdrop-filter:blur(12px);border:max(1px,var(--bw)) solid var(--ac);color:var(--t);border-radius:16px 16px 4px 16px;padding:.75em 1em;font-weight:600;font-size:14px;line-height:1.4;text-align:left;opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none}
.bub.flip{right:auto;left:85%;border-radius:16px 16px 16px 4px}
.bub.show{opacity:1;transform:none}
.ask{position:absolute;right:90%;bottom:4%;width:250px;display:none;align-items:center;gap:6px;background:var(--sf);backdrop-filter:blur(12px);border:max(1px,var(--bw)) solid var(--ac);border-radius:var(--pr);box-shadow:var(--ss);padding:5px 5px 5px 14px;cursor:auto}
.ask.open{display:flex}.ask.flip{right:auto;left:90%}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:600 14px var(--fb);user-select:text;-webkit-user-select:text;cursor:text}
.ask input::placeholder{color:var(--m)}
.ask:focus-within{box-shadow:var(--ss),0 0 16px var(--gl)}
.ask button{flex:none;width:30px;height:30px;border-radius:var(--sr);background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:14px}
/* filler page */
.page{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8em;padding:0 1.5em;z-index:25;animation:pin .6s ease}
.page.open{display:flex}
@keyframes pin{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.pg .wrap,.pg .top{visibility:hidden}
.pe{color:var(--ac);font-weight:700;letter-spacing:.14em;font-size:13px}
.page h2{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(56px*var(--hs));line-height:1.1;text-shadow:0 0 .45em var(--gl),0 0 1.4em var(--gl)}
.page p{color:var(--m);line-height:1.45;max-width:36em}
.page .solid{margin-top:.8em}
[hidden]{display:none!important}
body.v-sub .nav{display:none}
.crumb{margin-bottom:18px}
#v-phys .sec,#v-cardio .sec{margin-top:0}
.grp{margin-top:26px}
.sas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:10px}
.sa{display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
button.sa:hover{transform:translateY(-4px);border-color:var(--ac)}
.sa h3{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(28px*(1 + var(--hs))/2);text-transform:none;letter-spacing:0;color:var(--t);margin:0}
.sa p{color:var(--m);font-size:13px;line-height:1.45}
.sa .ft{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--m);padding-top:10px;border-top:1px solid var(--ln)}
.sa .ft b{color:var(--ac)}
.sa.off{opacity:.45}
.ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;gap:6px}
.par{margin-bottom:14px}
.ph{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center}
.ph h3{margin:0 0 2px}
.pa{text-align:right}.pa b{display:block;font-size:28px;line-height:1.1}.pa b small{font-size:13px;color:var(--m);font-weight:400;margin-left:4px}
.pa .dl{font-size:13px;font-weight:700}
.pb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pd{margin-top:16px;padding-top:16px;border-top:1px solid var(--ln)}
.cw{position:relative;padding-left:34px}
.cw svg{width:100%;height:170px;display:block;overflow:visible}.cw svg *{vector-effect:non-scaling-stroke}
.yl{position:absolute;left:0;font-size:11px;color:var(--m)}.yl.t{top:0}.yl.b{bottom:0}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin:6px 0 0 34px}
.cap{font-size:12px;color:var(--m);margin:8px 0 12px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.st2{border:1px solid var(--ln);border-radius:calc(var(--br)*.5);padding:10px 12px}.st2 span{display:block;font-size:12px;color:var(--m)}.st2 b{font-size:18px}
.evl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ev{border:1px solid var(--ln);border-radius:var(--pr);padding:8px 18px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:28;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px;animation:pin .3s ease}
.dlg{width:min(520px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative}
.dlg h3{margin:0;font-size:13px}.dlg p{color:var(--m);line-height:1.45;font-size:14px}
.dlg .x{position:absolute;right:14px;top:10px;font-size:22px;color:var(--m)}
@media (max-width:700px){.ph{grid-template-columns:1fr}.pa,.pb{text-align:left;justify-content:flex-start}}
@media (max-width:980px){.ais{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}}

(function(){
var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)},root=document.documentElement,pgOpen=false;

};

/* ---------- Dashboard ---------- */
var TILES=[
 ["Resting heart rate","64","bpm","▲ +6 vs usual","warn",35,25,72,"Resting heart rate is 6 bpm above your usual range for 3 days. The records behind it are linked, and I won’t guess a cause."],
 ["HRV","—","","◆ Low signal quality","info",0,0,0,"The wearable signal was poor overnight, so HRV was left out. Missing data is shown, never read as normal."],
 ["Blood pressure","118/76","mmHg","✔ In usual range","ok",30,40,48,"Both numbers sit inside your personal range."],

 ["Sleep","7 h 20","","✔ 92% of goal","ok",40,35,58,"7 h 20 min last night, 92% of your goal."],
 ["Hydration","64","%","▲ 1.3 of 2 L","warn",50,35,28,"About 300 ml more would bring you back toward your usual range."],
 ["Cognitive (PVT median)","262","ms","✔ Steady trend","ok",35,30,52,"Reaction time is within your baseline. Accuracy and speed are tracked side by side."],
 ["Radiation dose","0.32","mSv/day","✔ Within safe range","ok",20,40,40,"Today’s dose rate is within the approved range."]

 ["Immune health","◆ Limited data","info","Concluded from temperature and symptom check-ins, sleep, stress, nutrition and radiation. No blood count is carried on this flight, and missing data is never read as normal."],

 h+='<div class="blk s12"><h3>Key indicators</h3><div class="tiles">'+TILES.map(function(t){return '<button class="tile'+(t[4]==="info"?" lq":"")+'" data-tip="'+t[8]+'"><span class="lb">'+t[0]+'</span><b>'+t[1]+'<small>'+t[2]+'</small></b><span class="dl c-'+t[4]+'">'+t[3]+'</span>'+(t[6]?'<span class="rb" role="img" aria-label="Position against your usual range"><span class="z" style="left:'+t[5]+'%;width:'+t[6]+'%"></span><span class="p" style="left:'+t[7]+'%"></span></span>':'<span class="rb"></span>')+'</button>'}).join('')+'</div><p class="note" style="margin-top:12px">The green band on each tile is your usual range. The white mark is today’s reading.</p></div>';

}

/* ---------- Notices ---------- */
var NT=[
 {p:"urgent",l:"Urgent · medical review",g:"!",h:"Potentially serious change detected. Medical review required.",m:"Blood pressure · today 08:52",a:"View evidence",ack:1,pg:"Blood Pressure history",to:["cardio","bp",0]},
 {p:"trend",l:"Important trend",g:"▲",h:"Resting heart rate has risen above its usual range",m:"Resting heart rate · 3 days · +6 bpm",a:"Open history",pg:"Resting heart rate history",to:["cardio","rhr",0]},
 {p:"over",l:"Overdue",g:"●",h:"Weekly cognitive battery overdue",m:"Cognitive tests · due yesterday · about 12 min",a:"Start test",pg:"Weekly cognitive battery",to:["cog","pvt",1]},
 {p:"ground",l:"Ground communication",g:"◆",h:"Send health assessment package to Earth for review",m:"Link available · you confirm before anything is sent",a:"Review package",pg:"Health assessment package"},
 {p:"routine",l:"Routine reminder",g:"○",h:"Blood pressure check due today",m:"Cardiovascular · today",a:"Open",pg:"Blood Pressure",to:["cardio","bp",1]}
];

var NS=NT.map(function(){return{s:0,r:""}});

 $("#nl").innerHTML=NT.map(function(n,i){var s=NS[i],col=n.p==="urgent"||n.p==="trend"?"warn":n.p==="over"?"info":"ac",st=s.s,act='';

 if(m==="tmgo")tmGo();else if(m==="tmfin")tmDone((Date.now()-TM.t0)/1000,0);else if(m==="tmcan"){clr();closeMd();say("Timer cancelled. Nothing was saved.")}
 else if(m==="tmsave"){p=TM.p;var sc=+$("#tmm").value,pc=Math.round(sc/TM.len*100);fin(p,p.n+" · "+fmts(sc)+(TM.g?" of walking":" on one leg")+" ("+pc+"% of 2 min)",pc>=80?"Strong result. Added to your tracking.":"Added to your tracking and compared with your own baseline.")}
 else if(m==="memgo")memGo();else if(m==="card")memCard(+b.dataset.i);
 else if(m==="accgo"){AS={n:0,ok:0};accRound()}
 else if(m==="odd"){if(+b.dataset.i===AS.odd)AS.ok++;AS.n++;if(AS.n<10)accRound();else{var pc2=AS.ok*10;fin(MP,"Accuracy · "+pc2+"% ("+AS.ok+" of 10 correct)",pc2>=MP.s[0].b-3?"Within your usual range.":"Below your usual range. Rest and try again later.")}}
 else if(m==="vae"){VA.eye=b.dataset.v;$$("#vae button").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}
 else if(m==="vago")vaChart();
 else if(m==="vap"||m==="vam"){VA.n=Math.max(0,Math.min(15,VA.n+(m==="vap"?1:-1)));$("#van").textContent=VA.n+" of 15"}
 else if(m==="vasv"){var ps=0;VCUM.forEach(function(c){if(VA.n>=c)ps++});var dec=[0,.2,.4,.6,.8,1][ps];fin(VA.p,"Visual acuity · "+VA.eye+" · "+VA.n+" of 15 symbols correct (about "+dec.toFixed(1)+" decimal)",dec>=.8?"Within your usual range.":"Lower than usual. Check the distance and lighting, then repeat.")}
 else if(m==="cht"){var i=CH.sel.indexOf(b.dataset.v);if(i>-1)CH.sel.splice(i,1);else CH.sel.push(b.dataset.v);b.setAttribute("aria-pressed",i<0)}
 else if(m==="chs")chatSend();
 else if(m==="chv"){var ip=$("#chi");if(ip&&ip.value.trim())CH.msgs.push(ip.value.trim());if(!CH.sel.length&&!CH.msgs.length){say("Pick an option or write a note first.");return}
  var tx=CH.sel.join(", ")+(CH.msgs.length?(CH.sel.length?" · ":"")+"Notes: "+CH.msgs.join(" / "):"");fin(CH.p,tx,"Saved. Your notes will be evaluated together with this entry.");var en=LOG[CH.p.k][0];en.notes=CH.msgs.slice();en.sel=CH.sel.slice();en.review=1}
 else if(m==="mcst"){var j=MS2.sel.indexOf(b.dataset.v);if(j>-1)MS2.sel.splice(j,1);else MS2.sel.push(b.dataset.v);b.setAttribute("aria-pressed",j<0)}
 else if(m==="mcsv"){if(MS2.sel.length)MC.sy[MS2.k]=MS2.sel;else delete MC.sy[MS2.k];closeMd();rerender();say("Symptoms saved for this day.")}}
