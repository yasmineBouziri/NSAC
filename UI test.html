<style>

--bg:linear-gradient(170deg,#0d1b27,#070f18);--dk:radial-gradient(80% 100% at 50% 100%,rgba(79,154,154,.28),rgba(127,134,201,.1) 55%,transparent 82%);--t:#e9eff3;--m:#9db0bf;--ln:rgba(233,239,243,.28);--ac:#9fd8cf;--ac2:#7f86c9;--ok:#8fd3b6;--warn:#e3ab90;--info:#a9b8f0;--on:#0b1a24;--gl:rgba(159,216,207,.7);

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--fb);color:var(--t);overflow:hidden;background:var(--bg)}
h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}

.au.a{width:55vw;height:40vh;left:-10vw;top:-8vh;background:var(--ac)}.au.b{width:50vw;height:45vh;right:-12vw;top:5vh;background:var(--ac2);animation-duration:38s}.au.c{width:40vw;height:30vh;left:30vw;top:-12vh;background:var(--warn);animation-duration:44s}
@keyframes dr{to{transform:translate(8vw,6vh) scale(1.15)}}
.neb{position:fixed;inset:-6%;display:var(--nbd);filter:url(#nf);background:radial-gradient(34% 30% at 50% 36%,rgba(236,246,255,.8),rgba(150,190,230,.4) 50%,transparent 78%),radial-gradient(60% 40% at 50% -5%,rgba(255,190,100,.85),transparent 70%),radial-gradient(52% 46% at 50% 38%,rgba(255,150,70,.4),transparent 75%),radial-gradient(85% 70% at 50% 42%,rgba(60,100,170,.5),transparent 82%)}

.star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.top{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 22px) 30px 0;z-index:20}
.logo b{font-family:var(--fh);font-size:calc(30px*(1 + var(--hs))/2);font-weight:var(--hw);font-style:var(--fi)}
.logo small{display:block;color:var(--m);font-size:13px}
.tbtn{border:var(--bw) solid var(--ln);border-radius:var(--pr);padding:9px 18px;font-size:14px;font-weight:700;color:var(--t);background:var(--sf);box-shadow:var(--ss)}
.themes{position:absolute;right:30px;top:calc(env(safe-area-inset-top,0px) + 70px);display:none;flex-direction:column;gap:4px;background:var(--sf);color:var(--t);border:1px solid var(--ln);border-radius:16px;padding:10px;backdrop-filter:blur(14px)}
.themes.open{display:flex}
.themes button{display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:12px;padding:8px 12px;font-size:14px;text-align:left}
.themes button[aria-pressed=true]{border-color:var(--ac)}
.sw{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--ln)}
.disk{position:fixed;left:50%;bottom:0;width:calc(var(--R)*2);height:var(--R);margin-left:calc(var(--R)*-1);border-radius:var(--R) var(--R) 0 0;background:var(--dk);border:var(--dbw) solid var(--ln);border-bottom:0;backdrop-filter:var(--dbl,none);box-shadow:var(--dsh,none)}
.slot{position:absolute;left:50%;bottom:0;width:calc(var(--R)*.095);height:calc(var(--R)*.095);margin:0 0 calc(var(--R)*-.0475) calc(var(--R)*-.0475);transition:transform .9s cubic-bezier(.3,1.25,.5,1);color:var(--m);z-index:2}
.o{width:100%;height:100%;border-radius:var(--sr);border:var(--bw) solid var(--ln);background:var(--sf);box-shadow:var(--ss);display:grid;place-items:center;backdrop-filter:var(--dbl,none);transition:background .4s,color .4s;animation:fz var(--du,6s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes fz{to{transform:translate(var(--dx,0),var(--dy,0))}}
.o svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.slot:hover,.hub:hover{color:var(--t)}
.sel{color:var(--on)!important}
.sel .o{background:var(--ac);border-color:var(--sbc,var(--ac));box-shadow:var(--ss),0 0 30px var(--gl)}
.hub{position:absolute;left:50%;bottom:calc(var(--R)*.015);width:calc(var(--R)*.065);height:calc(var(--R)*.065);margin-left:calc(var(--R)*-.0325);color:var(--m)}
.hub .o{animation:none}
.sl{position:absolute;left:0;right:0;top:calc(var(--R)*.09);text-align:center;font-size:calc(var(--R)*.0165);letter-spacing:.14em;color:var(--ac);font-weight:700}
.arr{position:absolute;bottom:calc(var(--R)*.035);width:calc(var(--R)*.05);height:calc(var(--R)*.05);border:var(--bw) solid var(--ln);border-radius:var(--sr);color:var(--t);background:var(--sf);box-shadow:var(--ss);font-size:calc(var(--R)*.026);display:grid;place-items:center}
.arr.l{left:calc(50% - var(--R)*.58)}.arr.r{left:calc(50% + var(--R)*.53)}
.panel{position:absolute;left:50%;bottom:calc(var(--R)*.085);width:calc(var(--R)*.92);margin-left:calc(var(--R)*-.46);height:calc(var(--R)*.7);font-size:calc(var(--R)*.0205);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;animation:pin .6s ease}
@keyframes pin{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.panel h2{font-family:var(--fh);font-style:var(--fi);font-weight:var(--hw);font-size:calc(3em*var(--hs));line-height:1.1;text-wrap:balance;text-shadow:0 0 .45em var(--gl),0 0 1.4em var(--gl)}
.panel.home h2{font-size:calc(3.3em*var(--hs));animation:gl 5s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 .6em var(--gl),0 0 1.8em var(--gl),0 0 3.2em var(--gl)}}
.panel p{margin:0;color:var(--m);line-height:1.45;max-width:36em}
.w{display:flex;justify-content:center;align-items:center;gap:2.2em;width:100%;margin-top:.3em}
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 2.2em;width:100%;max-width:36em;text-align:left}
.home .notes{grid-template-columns:1fr;max-width:23em}
.notes button{width:100%;display:flex;align-items:center;gap:.8em;padding:.5em .2em;border-bottom:1px solid var(--ln);text-align:left}
.notes .ic{width:1.2em;flex:none;text-align:center}
.ok .ic,.c-ok{color:var(--ok)}.warn .ic,.c-warn{color:var(--warn)}.info .ic,.c-info{color:var(--info)}
.notes em{margin-left:auto;font-style:normal;font-size:.8em;color:var(--m)}
.notes .done span:not(.ic){text-decoration:line-through;opacity:.5}
.rings{display:flex;gap:1.2em}
.rg{display:flex;flex-direction:column;align-items:center;gap:.3em;font-weight:700;transition:transform .2s}
.rg:hover{transform:translateY(-4px)}.rg svg{width:5.2em;height:5.2em;overflow:visible}
.rdl{color:var(--m);font-size:.9em;text-align:left;margin-top:.5em}
.orb{width:7em;height:7em;border-radius:50%;display:grid;place-items:center;color:var(--on);font-weight:700;text-align:center;line-height:1.2;background:radial-gradient(circle at 35% 30%,#ffffffaa,var(--ac2) 48%,var(--ac));transition:transform 4s ease-in-out;box-shadow:0 0 50px var(--gl)}
.orb b{display:block;font-size:1.6em}
.pill{border:max(1px,var(--bw)) solid var(--ln);border-radius:var(--pr);padding:.45em 1.2em;font-weight:700;color:var(--t);background:var(--sf);box-shadow:var(--ss);transition:transform .2s,border-color .2s}
.pill:hover,.pill:focus-visible,.pill[aria-pressed=true]{border-color:var(--ac)}
.pill:hover{transform:translateY(-3px)}
.pill[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 30%,var(--sf))}
.pill.sm{padding:.3em .9em;font-size:.9em}.pill small{opacity:.65;margin-left:.5em;font-weight:400}
.col{display:flex;flex-direction:column;gap:.6em;align-items:center}
.row2{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.rc{display:flex;gap:.6em;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--m);font-size:.85em;margin-top:.2em}
.bd{height:17em;width:auto;overflow:visible}
.hs{fill:var(--sf);stroke:var(--ac);stroke-width:1.6;cursor:pointer;transition:.2s;transform-box:fill-box;transform-origin:center}
.hs:hover,.hs.on{fill:var(--ac)}.hs.warn{stroke:var(--warn)}.hs.pu{animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.3)}}
.info{text-align:left;width:17em;display:flex;flex-direction:column;gap:.5em}
.info h3{font-family:var(--fh);font-size:2em;font-weight:var(--hw);font-style:var(--fi)}
.info b{font-size:1.6em}.info span{color:var(--m);line-height:1.4}
.dial{width:14em;height:14em;flex:none}.dial text{fill:var(--m);font-size:5px;text-anchor:middle}.dial .sg{cursor:pointer;transition:.3s}
.dial #ct{fill:var(--t);font-size:8px;font-family:var(--fh);font-weight:700}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:.5em;text-align:left}
svg.cab{width:30em;height:6.5em;overflow:visible}.cab .rm{fill:var(--sf);stroke:var(--ln);stroke-width:1.5;cursor:pointer;transition:.3s}
.cab g:hover .rm,.cab g.on .rm{stroke:var(--ac);fill:color-mix(in srgb,var(--ac) 22%,var(--sf))}.cab text{fill:var(--t);font-size:8px;text-anchor:middle;pointer-events:none;font-weight:700}
.rows{width:34em;display:flex;flex-direction:column;gap:.6em}
.r{display:grid;grid-template-columns:8em 1fr 10em;align-items:center;gap:1em;text-align:left}
.bar{height:4px;border-radius:4px;background:var(--ln)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .8s}
.r em{font-style:normal;font-size:.9em;color:var(--m)}
.fld{position:relative;width:34em;height:10em;border:1px dashed var(--ln);border-radius:1.2em;overflow:hidden}
.st{position:absolute;color:var(--ac);text-shadow:0 0 12px var(--gl);animation:fz var(--du) ease-in-out infinite alternate}
.st.pop{animation:pop .35s forwards}@keyframes pop{to{transform:scale(2.4);opacity:0}}
.tg{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em .2em;border-bottom:1px solid var(--ln);width:100%;font-weight:700;text-align:left}
.tg u{text-decoration:none;display:flex;align-items:center;gap:.6em;color:var(--m);font-size:.85em}
.tg u s{width:2.4em;height:1.3em;border-radius:99px;border:1px solid var(--ln);position:relative;transition:.2s}
.tg u s::after{content:"";position:absolute;top:.17em;left:.2em;width:.85em;height:.85em;border-radius:50%;background:var(--m);transition:.2s}
.tg[aria-checked=true] u s{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 30%,transparent)}.tg[aria-checked=true] u s::after{left:1.2em;background:var(--ac)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 2.2em;width:100%;max-width:38em}
.rn{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em .2em;border-bottom:1px solid var(--ln);font-weight:700;text-align:left}.rn input{accent-color:var(--ac);width:9em}
.sim{position:relative;width:9em;height:9em;display:grid;place-items:center;flex:none}
.pl{width:3em;height:3em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--ac2) 55%,var(--warn))}
.orbit{position:absolute;inset:0;border:1px dashed var(--ln);border-radius:50%;animation:sp 10s linear infinite}
.orbit span{position:absolute;left:50%;top:-.45em;width:.9em;height:.9em;margin-left:-.45em;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
.cr{height:8em;width:22em;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.cr div{animation:sc 16s linear infinite;line-height:2;color:var(--m)}.cr b{color:var(--t)}
@keyframes sc{from{transform:translateY(8em)}to{transform:translateY(-100%)}}
.solid{background:var(--ac);color:var(--on);font-weight:700;border:var(--bw) solid var(--sbc,var(--ac));border-radius:var(--pr);padding:.5em 1.6em;box-shadow:var(--ss)}
.stp{width:24em;text-align:left;border-left:2px solid var(--ac);padding-left:1em;min-height:5.5em}.stp h3{font-size:1.4em;font-weight:700;margin-bottom:.2em}.stp span{color:var(--m);line-height:1.45}
.dots{display:flex;gap:.5em;justify-content:center}.dots i{width:.6em;height:.6em;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--ac)}
.alien{position:fixed;right:1.8vw;bottom:2.5vh;z-index:30;width:calc(var(--R)*.1);min-width:76px;touch-action:none;cursor:grab;user-select:none}
.alien.drag{cursor:grabbing}
.zi{animation:fl 5s ease-in-out infinite}.alien.drag .zi{animation:none;transform:scale(1.08)}
.alien svg{width:100%;display:block;filter:drop-shadow(0 0 16px var(--gl));transition:transform .3s}
.alien:hover svg{transform:rotate(-6deg) scale(1.06)}
@keyframes fl{50%{transform:translateY(-12px)}}
.eyes{transform-origin:50px 58px;animation:bk 6s infinite}
@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bub{position:absolute;right:85%;bottom:70%;width:15em;background:var(--sf);backdrop-filter:blur(12px);border:max(1px,var(--bw)) solid var(--ac);color:var(--t);border-radius:16px 16px 4px 16px;padding:.75em 1em;font-weight:600;font-size:14px;line-height:1.4;text-align:left;opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none}
.bub.flip{right:auto;left:85%;border-radius:16px 16px 16px 4px}
.bub.show{opacity:1;transform:none}
.rm *{animation:none!important;transition:none!important}.lg .panel{font-size:calc(var(--R)*.024)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:720px){.panel{font-size:calc(var(--R)*.024)}.w{flex-wrap:wrap;gap:1em}.notes,.sgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="nf" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".007 .012" numOctaves="4" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="220" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
